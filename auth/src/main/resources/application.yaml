spring:
  application:
    name: auth
  datasource:
    url: jdbc:h2:file:./data/auth
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:bd/migracion
  h2:
    console:
      enabled: true
      path: /consola-h2

recetaya:
  seguridad:
    jwt:
      emisor: ${RECETAYA_JWT_EMISOR:http://localhost:8081}
      secreto: ${RECETAYA_JWT_SECRETO:}
      duracion: PT30M
    usuario-inicial:
      correo-electronico: ${RECETAYA_AUTH_USUARIO_INICIAL_CORREO:}
      contrasena: ${RECETAYA_AUTH_USUARIO_INICIAL_CONTRASENA:}
      nombre: ${RECETAYA_AUTH_USUARIO_INICIAL_NOMBRE:}

server:
  port: 8081
  address: 127.0.0.1
