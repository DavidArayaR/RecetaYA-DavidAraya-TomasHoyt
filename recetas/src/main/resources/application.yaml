spring:
  application:
    name: recetas
  datasource:
    url: jdbc:h2:file:./data/recetas-recetaya
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:bd/migracion
  h2:
    console:
      enabled: false

recetaya:
  seguridad:
    jwt:
      emisor: ${RECETAYA_JWT_EMISOR:http://localhost:8081}
      secreto: ${RECETAYA_JWT_SECRETO:}

server:
  port: 8082
  address: 127.0.0.1
